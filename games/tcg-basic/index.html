<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TCG Basic</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0d1a;
      --surface:   #1a1a2e;
      --border:    #2a2a5a;
      --accent:    #4a7fcb;
      --text:      #e0e0f0;
      --text-dim:  #888;
      --green:     #2d6a4f;
      --red:       #c1121f;
      --gold:      #d4af37;
    }

    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', sans-serif; height: 100vh;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── Lobby ── */
    #lobby-screen {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; flex: 1;
    }
    #lobby-screen h1 { font-size: 2.5rem; color: var(--gold); letter-spacing: 3px; }
    #lobby-screen p  { color: var(--text-dim); }
    .lobby-row { display: flex; gap: 8px; }
    #room-input {
      padding: 8px 14px; border-radius: 8px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); font-size: 14px; width: 200px;
    }
    .room-info {
      display: none; flex-direction: column; align-items: center; gap: 10px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 22px;
    }
    .room-info__label { font-size: 11px; color: var(--text-dim); letter-spacing: 1px; }
    #room-id-display  { font-size: 1.2rem; font-weight: bold; color: var(--gold); letter-spacing: 3px; }
    .room-info__actions { display: flex; gap: 8px; }
    .btn-copy {
      padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
      font-size: 12px; font-weight: bold; cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .btn-copy--id  { background: #1e1e3a; color: var(--text); }
    .btn-copy--url { background: #1a2e1a; color: #69db7c; border-color: #2d6a4f; }
    .btn-copy--done  { background: #2d6a4f !important; color: #fff !important; border-color: #2d6a4f !important; }
    .btn-enter { background: #1a2a3a; color: #74c0fc; border-color: #2a4a6a; width: 100%; text-align: center; }
    .btn-enter:hover { background: #1d3a5a !important; }

    /* ── Jogo ── */
    #game-screen { display: flex; flex-direction: column; flex: 1; gap: 4px; padding: 8px; }
    #game-screen.hidden { display: none; }
    #lobby-screen.hidden { display: none; }

    /* HUD */
    #hud {
      display: flex; align-items: center; gap: 16px;
      background: var(--surface); border-radius: 10px; padding: 6px 14px;
      font-size: 13px; border: 1px solid var(--border);
    }
    #opponent-hp   { color: var(--red); font-weight: bold; }
    #hp-display    { color: #69db7c; font-weight: bold; }
    #mana-display  { color: #74c0fc; }
    #phase-display { color: var(--gold); }
    #turn-display  { margin-left: auto; font-weight: bold; }

    /* Campos */
    .board {
      display: grid; grid-template-rows: 1fr auto 1fr auto; flex: 1; gap: 6px;
    }
    .field {
      display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start;
      background: var(--surface); border-radius: 10px; padding: 8px;
      border: 2px dashed var(--border); min-height: 80px;
    }
    #opponent-field { border-color: var(--red); opacity: 0.9; }
    #player-field   { border-color: var(--green); }
    .field-label    { font-size: 11px; color: var(--text-dim); padding: 2px 8px; }

    /* Mão */
    #hand {
      display: flex; gap: 6px; padding: 8px;
      background: rgba(0,0,0,0.3); border-radius: 10px;
      overflow-x: auto; min-height: 60px;
    }
    #hand svg { transition: transform 0.15s; cursor: grab; flex-shrink: 0; }
    #hand svg:hover { transform: translateY(-12px) scale(1.05); }

    /* Cemitério */
    #graveyard {
      width: 50px; height: 70px; background: var(--surface);
      border: 1px dashed var(--border); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: var(--text-dim);
    }

    /* Botões */
    .ui-btn {
      padding: 8px 20px; border-radius: 8px; border: none;
      font-size: 14px; cursor: pointer; font-weight: bold; transition: 0.15s;
    }
    .ui-btn--primary   { background: var(--accent); color: #fff; }
    .ui-btn--secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .ui-btn:hover:not(:disabled) { filter: brightness(1.15); }
    .ui-btn:disabled   { opacity: 0.4; cursor: not-allowed; }
    #btn-end-phase { background: var(--gold); color: #000; }

    /* Dropzone activa */
    .dropzone--active { border-color: var(--gold) !important; background: rgba(212,175,55,0.08) !important; }

    /* Modal */
    .ui-modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: flex; align-items: center; justify-content: center;
      z-index: 8000; opacity: 0; transition: opacity 0.3s;
    }
    .ui-modal-overlay--visible { opacity: 1; }
    .ui-modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 28px 32px; min-width: 280px; max-width: 420px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .ui-modal__title { font-size: 1.2rem; font-weight: bold; color: var(--gold); }
    .ui-modal__actions { display: flex; gap: 8px; justify-content: flex-end; }

    /* Toast */
    .ui-toast {
      position: fixed; bottom: 20px; right: 20px; z-index: 9000;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 18px; font-size: 13px;
      opacity: 0; transform: translateY(10px); transition: 0.3s;
      max-width: 320px;
    }
    .ui-toast--visible { opacity: 1; transform: translateY(0); }
    .ui-toast--error   { border-color: var(--red); }
    .ui-toast--info    { border-color: var(--accent); }

    /* Shake */
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-6px); }
      75%      { transform: translateX(6px); }
    }
    .shake { animation: shake 0.3s ease; }

    /* Scroll fino */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  </style>
</head>
<body>

  <!-- Tela de Lobby -->
  <div id="lobby-screen">
    <h1>TCG Basic</h1>
    <p>Duelo de cartas 1v1 — multiplayer P2P</p>
    <button id="btn-create" class="ui-btn ui-btn--primary">Criar Sala</button>
    <div class="lobby-row">
      <input id="room-input" type="text" placeholder="ID da sala...">
      <button id="btn-join" class="ui-btn ui-btn--secondary">Entrar</button>
    </div>
    <div id="room-info" class="room-info">
      <span class="room-info__label">CÓDIGO DA SALA</span>
      <span id="room-id-display"></span>
      <div class="room-info__actions">
        <button id="btn-copy-id"  class="btn-copy btn-copy--id"  data-label="Copiar ID">Copiar ID</button>
        <button id="btn-copy-url" class="btn-copy btn-copy--url" data-label="Copiar Link">Copiar Link</button>
      </div>
      <div class="lobby-status">
        <span>⏳ Aguardando oponente...</span>
      </div>
    </div>
  </div>

  <!-- Tela de Jogo -->
  <div id="game-screen" class="hidden">
    <!-- HUD -->
    <div id="hud">
      <span id="opponent-hp">HP: 20</span>
      <span id="mana-display">Mana: 0/0</span>
      <span id="phase-display">Fase: —</span>
      <span id="hp-display">HP: 20</span>
      <span id="turn-display">Aguardando...</span>
      <button id="btn-end-phase" class="ui-btn" disabled>Próxima Fase</button>
    </div>

    <div class="board">
      <!-- Campo oponente -->
      <div id="opponent-field" class="field"></div>
      <div class="field-label">Campo do Oponente</div>

      <!-- Campo próprio -->
      <div class="field-label">Seu Campo</div>
      <div id="player-field" class="field"></div>
    </div>

    <!-- Mão -->
    <div id="hand"></div>

    <!-- Cemitério (decorativo por ora) -->
    <div id="graveyard" style="position:absolute;right:12px;bottom:80px;">⚰</div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
